name: Release

# When a version-bump commit lands on main (from a merged release PR opened by
# scripts/release.sh), publish any package whose version changed and that does
# not yet have a tag. Each package is versioned and tagged independently — git
# tags are namespaced per package (<package>-vX.Y.Z) so packages never collide.
on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/ to (re)publish at its current version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect packages to release
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history + tags to diff and to check existing tags

      - name: Detect changed, unreleased package versions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RESULT="$(node scripts/detect-releases.mjs)"
          echo "Release detection: $RESULT"
          echo "any=$(node -p 'JSON.parse(process.argv[1]).any' "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).matrix)' "$RESULT")" >> "$GITHUB_OUTPUT"

  release:
    name: Publish ${{ matrix.name }}@${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      id-token: write # OIDC trusted publishing to npm
    strategy:
      fail-fast: false
      max-parallel: 1 # serialize tag/release creation against the shared repo
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 already
        # bundles a new enough npm, but pinning to latest keeps this working if
        # the runner's Node ever moves back. Without it, publish fails with a
        # misleading 404 on the PUT to the registry.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm eslint ${{ matrix.dir }}

      - name: Format check
        run: pnpm prettier --check ${{ matrix.dir }}

      - name: Type check
        working-directory: ${{ matrix.dir }}
        run: pnpm typecheck

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: pnpm test
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: pnpm build

      - name: Validate package metadata and contents
        working-directory: ${{ matrix.dir }}
        run: |
          pnpm run --if-present check:manifest
          pnpm run --if-present check:package

      - name: Pack and publish to npm
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT

          pnpm --dir "${{ matrix.dir }}" pack --pack-destination "$pack_dir"
          artifact="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact"

          node scripts/publish-package.mjs \
            --package-dir "${{ matrix.dir }}" \
            --tarball "$artifact" \
            --tag "${{ matrix.npm_tag }}"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          PRERELEASE: ${{ matrix.prerelease }}
        run: |
          set -euo pipefail

          # Span release notes from the previous tag for THIS package so the
          # changelog only reflects changes relevant to it.
          PREV_TAG="$(git tag --list "${NAME}-v*" --sort=-v:refname | head -n1 || true)"
          NOTES_FLAGS="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAGS="$NOTES_FLAGS --notes-start-tag $PREV_TAG"
          fi
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "@parallel-web/${NAME}@${VERSION}" \
            $NOTES_FLAGS \
            $PRERELEASE_FLAG

      - name: Summary
        run: |
          echo "✅ Ensured @parallel-web/${{ matrix.name }}@${{ matrix.version }} is published (dist-tag: ${{ matrix.npm_tag }})"
          echo "Tag: ${{ matrix.tag }}"
