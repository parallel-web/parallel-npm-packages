name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

  dsh-compatibility:
    name: DSH Compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --filter @parallel-web/dsh-web-search... --frozen-lockfile

      - name: Run deterministic plugin checks
        run: pnpm --filter @parallel-web/dsh-web-search check

      - name: Verify packed DSH profile lifecycle
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          dsh_home="$(mktemp -d)"
          trap 'rm -rf "$pack_dir" "$dsh_home"' EXIT

          pnpm --dir packages/dsh-web-search pack --pack-destination "$pack_dir"
          artifact="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          version="$(node -p "require('./packages/dsh-web-search/package.json').version")"

          node packages/dsh-web-search/scripts/verify-packed-artifact.mjs \
            --tarball "$artifact"
          DSH_HOME="$dsh_home" pnpm --dir packages/dsh-web-search exec dsh \
            --profile web --dump-config > "$dsh_home/before.yml"
          DSH_HOME="$dsh_home" pnpm --dir packages/dsh-web-search exec dsh \
            plugin --profile web add "$artifact"
          DSH_HOME="$dsh_home" pnpm --dir packages/dsh-web-search exec dsh \
            --profile web --dump-config > "$dsh_home/after.yml"
          node packages/dsh-web-search/scripts/verify-packed-profile.mjs \
            --dsh-home "$dsh_home" \
            --expected-version "$version"
          DSH_HOME="$dsh_home" pnpm --dir packages/dsh-web-search exec dsh \
            plugin --profile web remove @parallel-web/dsh-web-search
          DSH_HOME="$dsh_home" pnpm --dir packages/dsh-web-search exec dsh \
            --profile web --dump-config > "$dsh_home/removed.yml"
          node packages/dsh-web-search/scripts/verify-profile-overlay.mjs \
            --before "$dsh_home/before.yml" \
            --after "$dsh_home/after.yml" \
            --removed "$dsh_home/removed.yml"
